[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bpp-runtime"
version = "0.1.0.dev0"
description = "The validator's own BPP model runtime: build from a pinned template, load weights-only submissions, serve them."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# `bpp-runtime check` runs on the validator host, which has no torch: the standard library only.
dependencies = []

[project.optional-dependencies]
# Everything that builds, loads, prompts and runs the network, plus the converter. The
# behavior_prompting source these checkpoints need is vendored under third_party/ and installed
# on its own (see README). Pinned to the versions the checkpoints were trained and verified with.
model = [
  "numpy>=1.23,<2",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "timm==1.0.20",
  "diffusers==0.35.1",
  "transformers==4.57.1",
  "hydra-core==1.3.2",
  "omegaconf==2.3.1",
  "safetensors==0.6.2",
  "opencv-python-headless==4.11.0.86",
  "scipy==1.15.3",
  "einops==0.6.1",
  "zarr==2.16.0",
  "numcodecs==0.13.1",
  "imagecodecs==2026.1.14",
  "lmdb==2.3.0",
  "h5py==3.16.0",
  "dill==0.3.7",
  "tqdm",
]
dev = ["pytest>=8"]

[project.scripts]
bpp-runtime = "bpp_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpp_runtime"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
# Upstream source kept as it was released; it is not ours to reformat.
extend-exclude = ["third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# importlib mode puts no test directory on sys.path; the tests share helpers from one module.
pythonpath = ["tests"]
markers = [
  "gpu: needs torch, a CUDA device, the vendored behavior_prompting and the BRL1 checkpoints",
]
