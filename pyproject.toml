[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# The family is `robotensor-*` on PyPI, so what belongs to this subnet is visible at a glance
# and the names cannot be taken by anyone else. The command keeps the short name.
name = "robotensor-vector-engine"
version = "0.2.0"
description = "Orchestration layer of Robotensor Vector, the action-grounded in-context learning competition."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pynacl>=1.5", "jsonschema>=4.20", "huggingface_hub>=1.0"]

[project.scripts]
vector-orchestrator = "vector_orchestrator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_orchestrator"]

# Every contract travels with the wheel, so an installed orchestrator reads the ones it was built
# with - `specs/` included, or a validator with no checkout could not name the track it runs.
[tool.hatch.build.targets.wheel.force-include]
"spec.json" = "vector_orchestrator/data/spec.json"
"store-schema.json" = "vector_orchestrator/data/store-schema.json"
"specs" = "vector_orchestrator/data/specs"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "packages/vector-policy/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vector-policy/tests"]
# Two test trees share module names such as test_package.py.
addopts = "--import-mode=importlib"
# importlib mode puts no test directory on sys.path; the orchestrator's tests import their
# conftest and store_helpers as plain modules, and the vector-policy tests share helpers from a
# module of their own. The orchestrator's directory comes first, so `conftest` is its own.
pythonpath = ["tests", "packages/vector-policy/tests"]
markers = [
  "sim: needs a plugged benchmark's simulator (assets, GPU)",
  "container: needs Docker and builds or runs a policy container",
  "slow: takes minutes",
  "network: asks the real Hugging Face Hub; skipped when it cannot be reached",
]
