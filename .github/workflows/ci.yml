name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.16.7
      - run: ruff check . && ruff format --check .
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]" -e packages/vector-policy
      - run: pytest -q -m "not sim and not container"
  # vector-policy is installed into competitors' images on its own: test the built distribution in an
  # environment holding nothing else but pytest.
  vector-policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m venv /tmp/policy-env
      - run: /tmp/policy-env/bin/pip install ./packages/vector-policy pytest
      - run: /tmp/policy-env/bin/pip list
      - run: /tmp/policy-env/bin/python -m pytest -q packages/vector-policy
